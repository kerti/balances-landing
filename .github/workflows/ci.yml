# Quality gate for the Astro site: lint, format, type-check, and a production
# build. Deploy is handled separately by Cloudflare Pages' Git integration
# (ADR-0002), so this workflow holds no secrets and does not deploy.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · type-check · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Resolve "22" to the newest 22.x, as Cloudflare Pages does, rather
          # than whatever patch the runner has cached.
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run astro:check
      - run: npm run build
